# Local infrastructure — starts only the database so the dev runs `npm run dev` locally.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: realloc
      POSTGRES_PASSWORD: realloc
      POSTGRES_DB: realloc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realloc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
